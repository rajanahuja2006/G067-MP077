apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp077-api
  labels:
    app: mp077-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp077-api
  template:
    metadata:
      labels:
        app: mp077-api
    spec:
      containers:
        - name: mp077-api
          image: mp077-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
